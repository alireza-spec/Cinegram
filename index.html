:root{--blue:#3390ec}
body{margin:0;font-family:DM Sans,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}

body[data-theme="lavender"]{--bg:#1a1626;--panel:#241f38;--panel2:#2d2747;--line:#3a3257;--text:#ece7f7;--muted:#a89ec4;--blue:#9b7ede;--bubble:#241f38;--bubble-user:#4a3d7a;--input:#2d2747;color-scheme:dark}
body[data-theme="sunset"]{--bg:#231a17;--panel:#2f231f;--panel2:#3a2c26;--line:#4a3831;--text:#f5e8e0;--muted:#b39a90;--blue:#e07856;--bubble:#2f231f;--bubble-user:#6b3a2e;--input:#3a2c26;color-scheme:dark}
body[data-theme="classic"]{--bg:#e8eef1;--panel:#ffffff;--panel2:#f4f7f9;--line:#d7dee3;--text:#263943;--muted:#6b7d88;--blue:#3390ec;--bubble:#ffffff;--bubble-user:#d7e9fb;--input:#ffffff;color-scheme:light}

body[data-theme="rose"]{--bg:#221419;--panel:#2e1c24;--panel2:#3a242e;--line:#4d303d;--text:#f7e6ec;--muted:#c09aa8;--blue:#e06a8a;--bubble:#2e1c24;--bubble-user:#5c2f42;--input:#3a242e;color-scheme:dark}
body[data-theme="glass"]{--bg:#101826;--panel:rgba(30,42,60,.85);--panel2:rgba(40,56,78,.85);--line:#2c3e55;--text:#e9eff6;--muted:#93a5b8;--blue:#5aa9e6;--bubble:#1a2a40;--bubble-user:#2c4a6e;--input:#1a2a40;color-scheme:dark}
button{font:inherit;cursor:pointer;background:var(--blue);color:#fff;border:0;border-radius:10px;padding:8px 14px}
button.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
input,textarea,select{font:inherit;background:var(--input);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
#app{display:flex;height:100vh;overflow:hidden}
#sidebar{width:330px;min-width:280px;background:var(--panel);border-inline-end:1px solid var(--line);display:flex;flex-direction:column}
#sideHead{padding:14px;border-bottom:1px solid var(--line)}
#sideHead h1{margin:0;font-size:20px;letter-spacing:.5px}
#sideHead small{color:var(--muted)}
#folderTabs{display:flex;gap:6px;flex-wrap:wrap;padding:10px;border-bottom:1px solid var(--line)}
#folderTabs button{background:transparent;color:var(--muted);padding:6px 10px;border-radius:20px}
#folderTabs button.on{background:var(--blue);color:#fff}
#searchBox{padding:10px;border-bottom:1px solid var(--line)}
#threadList{overflow:auto;flex:1;padding:6px}
.thread{display:flex;gap:10px;align-items:center;padding:9px;border-radius:12px;cursor:pointer;position:relative}
.thread:hover,.thread.sel{background:var(--panel2)}
.avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden;background:var(--blue)}
.avatar img{width:100%;height:100%;object-fit:cover} .workchip{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:10px;padding:1px 7px;margin-left:6px;color:var(--muted);vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.thread b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;max-width:200px}
.thread .menuBtn{margin-inline-start:auto;background:transparent;color:var(--muted);padding:4px 8px}
#main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
#chatHead{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
#chatHead h2{margin:0;font-size:17px}
#chatHead small{color:var(--muted)}
#chatBg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.13;pointer-events:none;z-index:0} #messages{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px;position:relative;z-index:1}
.msg{max-width:72%;padding:10px 13px;border-radius:16px;background:var(--bubble);align-self:flex-start;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.msg.me{align-self:flex-end;background:var(--bubble-user)}
.msg .who{font-size:12px;font-weight:700;color:var(--blue);margin-bottom:3px}
.msg .time{font-size:11px;color:var(--muted);text-align:end;margin-top:4px}
.msg img.media,.msg video.media{max-width:280px;border-radius:10px;display:block;margin-top:6px}
.msg .reply{font-size:12px;color:var(--muted);border-inline-start:3px solid var(--blue);padding-inline-start:8px;margin-bottom:5px}
.msg .tools{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.msg .tools button{background:transparent;color:var(--muted);padding:2px 6px;font-size:12px}
.msg .reacts{font-size:13px;margin-top:4px}
.msg.sticker{background:transparent;box-shadow:none;text-align:center}
.msg.sticker .avatar{width:110px;height:110px;font-size:38px;margin:0 auto 6px}
.msg.sticker p{background:var(--bubble);display:inline-block;padding:6px 12px;border-radius:14px;margin:0}
#typing{padding:6px 18px;color:var(--muted);font-size:13px;min-height:22px}
#composer{padding:12px;background:var(--panel);border-top:1px solid var(--line)}
#composerRow{display:flex;gap:8px;align-items:flex-end}
#composer textarea{flex:1;resize:none;min-height:44px;max-height:118px}
#banner{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:13px;display:flex;justify-content:space-between;gap:8px}
#welcome{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
#welcome h1{font-size:28px;margin:10px 0}
#welcome p{color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:560px;width:100%;max-height:88vh;overflow:auto}
.panel h2{margin-top:0}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.dirGroup{margin-top:14px}
.dirGroup b{display:block;margin-bottom:6px}
.dirItem{display:flex;gap:10px;align-items:center;padding:7px;border-radius:10px;cursor:pointer}
.dirItem:hover{background:var(--panel2)}
.mediaGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:12px}
.mediaGrid img,.mediaGrid video{width:100%;border-radius:10px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:20px;z-index:99;display:none}
#mentionBox{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;max-height:200px;overflow:auto;z-index:40}
#mentionBox div{padding:7px;border-radius:8px;cursor:pointer}
#mentionBox div:hover{background:var(--panel2)}
#auth{max-width:420px;margin:8vh auto;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:18px}
#auth h1{text-align:center}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.tabs button{background:transparent;color:var(--muted)}
.tabs button.on{color:var(--text);font-weight:700}
label{font-size:13px;color:var(--muted);display:block;margin-top:10px}
.pill{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:5px 10px;margin:3px;font-size:13px}
@media(max-width:760px){#sidebar{width:100%}#sidebar.hidden{display:none}#main.hidden{display:none}}
</style>
</head>

<p style="text-align:center;color:var(--muted)">A little closer to your favorite worlds</p>
<div class="tabs"><button id="tabIn" class="on">Sign in</button><button id="tabUp">Sign up</button></div>

</div>

<main id="main">

<div id="chatHead"><button class="ghost" id="btnBack" style="display:none">&#8592;</button><div class="avatar" id="chatAvatar">C</div><div style="flex:1;min-width:0"><h2 id="chatTitle"></h2><small id="chatSub"></small></div><button class="ghost" id="btnMedia">Media</button><button class="ghost" id="btnProfile">Profile</button></div>

<div id="messages"></div>
<div id="typing"></div>

</div>
</main>
</div>

function extractFrames(file){
return new Promise(function(resolve){
if(file.type.indexOf("video/")!==0){ resolve([]); return; }
try{
var url=URL.createObjectURL(file); var v=document.createElement("video"); v.muted=true; v.preload="metadata"; v.src=url;
v.onloadedmetadata=function(){ var dur=v.duration||0; if(!dur||!v.videoWidth){ resolve([]); return; } var times=[Math.min(0.2,dur/4),dur/2,Math.max(0,dur-0.2)]; var out=[]; var i=0;
function next(){ if(i>=times.length){ resolve(out); return; } v.currentTime=times[i]; v.onseeked=function(){ try{ var cv=document.createElement("canvas"); var sc=Math.min(1,640/Math.max(v.videoWidth,v.videoHeight)); cv.width=Math.max(1,Math.round(v.videoWidth*sc)); cv.height=Math.max(1,Math.round(v.videoHeight*sc)); var ctx=cv.getContext("2d"); ctx.drawImage(v,0,0,cv.width,cv.height); cv.toBlob(function(b){ if(b) out.push(URL.createObjectURL(b)); i++; next(); },"image/jpeg",0.78); }catch(e){ i++; next(); } }; }
next(); };
v.onerror=function(){ resolve([]); };
}catch(e){ resolve([]); }
});
}
function chooseFile(file){

extractFrames(file).then(function(frames){ var url=URL.createObjectURL(file); window.__pendingMedia={url:url,name:file.name,type:file.type||"application/octet-stream",frames:frames}; err.textContent="Attached: "+file.name+(frames.length?" ("+frames.length+" sample frames)":"")+". Type a message or press send."; document.getElementById("draftInput").focus(); });
}
async function startRecording(kind){
var recBtn=document.getElementById(kind==="video"?"btnVideo":"btnVoice");
if(rec){ try{ rec.stop(); }catch(e){} return; }
try{
var stream=await navigator.mediaDevices.getUserMedia(kind==="video"?{audio:true,video:true}:{audio:true});
var mime=""; var cands=kind==="video"?["video/webm;codecs=vp8,opus","video/webm","video/mp4"]:["audio/webm;codecs=opus","audio/webm","audio/mp4"];
for(var i=0;i<cands.length;i++){ if(window.MediaRecorder && MediaRecorder.isTypeSupported(cands[i])){ mime=cands[i]; break; } }
recChunks=[]; rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);
rec.ondataavailable=function(e){ if(e.data && e.data.size) recChunks.push(e.data); };
rec.onstop=function(){ var type=mime||(kind==="video"?"video/webm":"audio/webm"); var blob=new Blob(recChunks,{type:type}); var ext=type.indexOf("mp4")>=0?".mp4":".webm"; var f=new File([blob],(kind==="video"?"video-message":"voice-message")+ext,{type:type}); rec=null; stream.getTracks().forEach(function(tr){ tr.stop(); }); chooseFile(f); };
rec.start(); toast("Recording… press the button again to stop.");
}catch(e){ document.getElementById("mediaErr").textContent="Recording failed: "+(e&&e.message?e.message:"Unknown error"); }
}

async function discoverModels(key,msgEl,selectEl){
var bases=[]; var b=(key.baseUrl||"").replace(/\/+$/,""); if(b) bases.push(b); if(b && !/\/v1$/i.test(b)) bases.push(b+"/v1");
var lastErr="";
for(var i=0;i<bases.length;i++){
try{
var res=await fetch(bases[i]+"/models",{headers:{"Authorization":"Bearer "+key.key,"Content-Type":"application/json"}});
if(!res.ok){ lastErr="HTTP "+res.status; continue; }
var data=await res.json(); var rows=[]; if(Array.isArray(data.data)) rows=data.data; else if(Array.isArray(data.models)) rows=data.models; else if(data.result && Array.isArray(data.result.data)) rows=data.result.data;
var ids=[]; rows.forEach(function(r){ var id=typeof r==="string"?r:(r&&r.id?r.id:(r&&r.name?r.name:"")); if(id && /^[A-Za-z0-9_.\-/:]{1,150}$/.test(id) && ids.indexOf(id)<0) ids.push(id); });
ids=ids.slice(0,150); key.models=ids; key.discoveryError=""; persist();
if(selectEl){ selectEl.innerHTML=""; ids.forEach(function(id){ var o=document.createElement("option"); o.value=id; o.textContent=id; selectEl.appendChild(o); }); if(key.model && ids.indexOf(key.model)>=0) selectEl.value=key.model; }
if(msgEl) msgEl.textContent=ids.length?ids.length+" "+tr("modelsFound"):tr("manualModel");
return ids;
}catch(e){ lastErr=e&&e.message?e.message:"Network error"; }
}
key.models=[]; key.discoveryError=lastErr; persist();
if(msgEl) msgEl.textContent=tr("discoverErr")+lastErr+". "+tr("manualModel");
return [];
}
