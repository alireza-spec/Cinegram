name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare web assets
        run: |
          mkdir -p www/icons
          cp index.html manifest.json sw.js giphy-key.js icon-512.png icon-192.png apple-touch-icon.png www/
          cp -r reaction-icons gif-pack stickers emoji www/
          cp icon-512.png www/icons/icon-512.png
          ls www | head -20
          test -f www/index.html
          test -f www/icons/icon-512.png
          test -d www/emoji

      - name: Shrink bundled images
        run: |
          python3 -m pip install -q pillow || echo "pillow install failed, keeping originals"
          python3 - << 'PY'
          import os
          targets = {'www/emoji': 96, 'www/reaction-icons': 96, 'www/stickers': 256}
          try:
              from PIL import Image
          except Exception as e:
              print('no PIL, keeping originals:', e)
              raise SystemExit(0)
          done = 0
          skipped = 0
          for root, px in targets.items():
              for dp, dn, fn in os.walk(root):
                  for f in fn:
                      if not f.lower().endswith('.webp'):
                          continue
                      p = os.path.join(dp, f)
                      try:
                          im = Image.open(p)
                          if max(im.size) <= px:
                              continue
                          im.thumbnail((px, px), Image.LANCZOS)
                          im.save(p, 'WEBP', quality=80)
                          done += 1
                      except Exception as e:
                          skipped += 1
          print('resized', done, 'skipped', skipped)
          PY
          du -sh www

      - name: Init Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.cinegram.app",
            "appName": "Cinegram",
            "webDir": "www",
            "android": {
              "allowMixedContent": true
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Set APK version and icon
        run: |
          python3 -m pip install -q pillow || echo "pillow install failed, will use plain copy"
          python3 - << 'PY'
          import os, re, shutil
          p = 'android/app/build.gradle'
          s = open(p).read()
          s = re.sub(r'versionCode \d+', 'versionCode 5', s)
          s = re.sub(r'versionName "[^"]*"', 'versionName "1.0.4"', s)
          open(p, 'w').write(s)
          print('versionCode 5' in s, 'versionName "1.0.4"' in s)
          src = 'www/icons/icon-512.png'
          sizes = {'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96, 'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192}
          try:
              from PIL import Image
              im0 = Image.open(src).convert('RGB')
              have_pil = True
          except Exception as e:
              print('no PIL, plain copy:', e)
              have_pil = False
          for d, px in sizes.items():
              res = os.path.join('android/app/src/main/res', d)
              if not os.path.isdir(res):
                  print('missing', d)
                  continue
              names = ['ic_launcher.png', 'ic_launcher_round.png', 'ic_launcher_foreground.png']
              if have_pil:
                  im = im0.resize((px, px), Image.LANCZOS)
                  for name in names:
                      im.save(os.path.join(res, name))
              else:
                  for name in names:
                      shutil.copy(src, os.path.join(res, name))
              print(d, 'icon set', px)
          PY
          ls android/app/src/main/res/mipmap-xxxhdpi/

      - name: Build debug APK
        run: |
          cd android && ./gradlew assembleDebug --stacktrace

      - name: Verify and rename APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh $APK
          unzip -l $APK | grep -i launcher | head -20 || true
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f 2>/dev/null | sort | tail -1)
          if [ -n "$AAPT" ]; then $AAPT dump badging $APK | grep -E "package:|application-label"; else echo "aapt2 not found, skipping badging check"; fi
          cp $APK Cinegram-v1.0.4.apk
          ls -lh Cinegram-v1.0.4.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cinegram-v1.0.4
          path: Cinegram-v1.0.4.apk

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: Cinegram v1.0.4 (APK)
          body: |
            Cinegram Android APK, built from the web app in this repo (v1.0.4).
            The app itself is bundled inside the APK, so it opens without a VPN; chats and AI still need internet.
            Install by sideloading: allow "Install unknown apps" for your browser, then open the APK.
            This is a debug-signed APK for direct installation. It is not a Play Store release build.
            Your chats live in the browser — after installing, sign in again in the app, or export a backup from the browser (Settings → Data and Storage → Export) and import it in the app.
          files: Cinegram-v1.0.4.apk
